services:
  dev:
    image: node:20-alpine
    container_name: anastasia-website-dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT}:3000"
    volumes:
      - .:/app
      - anastasia_website_node_modules:/app/node_modules

  app:
    build: .
    container_name: anastasia-website-app
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: anastasia-website-web
    depends_on:
      - app
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./nginx/${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro

volumes:
  anastasia_website_node_modules:
