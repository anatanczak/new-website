services:
  dev:
    image: node:20-alpine
    container_name: anastasia-website-dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT}:3000"
    volumes:
      - .:/app
      - anastasia_website_node_modules:/app/node_modules

  app:
    build: .
    container_name: anastasia-website-app
    profiles:
      - runtime
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: anastasia-website-web
    profiles:
      - runtime
    depends_on:
      - app
    ports:
      - "${HOST_PORT}:80"
      - "${HOST_SSL_PORT}:443"
    volumes:
      - ./nginx/${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR}:/etc/letsencrypt
      - ${ACME_WEBROOT}:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: anastasia-website-certbot
    profiles:
      - certbot
    volumes:
      - ${LETSENCRYPT_DIR}:/etc/letsencrypt
      - ${ACME_WEBROOT}:/var/www/certbot

volumes:
  anastasia_website_node_modules:
