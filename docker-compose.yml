services:
  dev:
    image: node:24-alpine
    container_name: anastasia-website-dev
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "1000"
    ports:
      - "127.0.0.1:${DEV_PORT}:3000"
    volumes:
      - .:/app
      - anastasia_website_node_modules:/app/node_modules

  app:
    build: .
    container_name: anastasia-website-app
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=1777
    expose:
      - "3000"
    networks:
      - backend

  nginx:
    image: nginx:1.30.5-alpine
    container_name: anastasia-website-web
    depends_on:
      - app
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./nginx/${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  anastasia_website_node_modules:
