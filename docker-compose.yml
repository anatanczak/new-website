services:
  app:
    build: .
    container_name: anastasia-website-app
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: anastasia-website-web
    depends_on:
      - app
    ports:
      - "${HOST_PORT}:80"
      - "${HOST_SSL_PORT}:443"
    volumes:
      - ./nginx/${NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR}:/etc/letsencrypt
      - ${ACME_WEBROOT}:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: anastasia-website-certbot
    volumes:
      - ${LETSENCRYPT_DIR}:/etc/letsencrypt
      - ${ACME_WEBROOT}:/var/www/certbot
