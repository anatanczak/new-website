name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t anastasia-website:ci .

      - name: Smoke test pages and public assets
        run: |
          docker run -d --name site -p 3000:3000 anastasia-website:ci
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in / /biography /apps /portfolio /contact /icons/logo.svg /files/cv_tanczak_fullstack.pdf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = 200 ] || { docker logs site; exit 1; }
          done
